name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # OpenCode runs plugins on Bun, so the tests run on Bun as well as Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: npm ci
      - run: npm run typecheck
      - name: Tests on Node
        run: npm test
      - name: Tests on Bun
        run: bun test test/
      - name: Release notes check
        run: node scripts/release-notes.mjs --check
